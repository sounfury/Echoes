<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220">
  <!-- 纸纤维噪点：横向略拉长的分形噪声，取亮部做成稀疏的暖褐色斑点（整体透明度很低） -->
  <filter id="f" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55 0.9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.24  0 0 0 0 0.16  0.55 0 0 0 -0.22"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#f)"/>
</svg>

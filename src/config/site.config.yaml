# =============================================================================
# Echoes - Site Configuration (Phase 1)
# =============================================================================

# 1. 站点基础信息
site:
  title: "Echoes"
  subtitle: "Automated & Stylized Digital Garden"
  url: https://blog.sounfury.top
  author: sounfury
  logoText: "ECHOES"
  timezone: Asia/Shanghai

# 2. 视觉与主题
theme:
  defaultMode: "light" # light | dark
  colors:
    accent: "#6528F7"
    terminal: "#00FF00"
    warning: "#FF0000"
    defaultCategory: "#777777"
    light:
      bg: "#f0f0f2"
      bgSecondary: "#e8e8ea"
      text: "#111111"
      textSecondary: "#6B7280"
      border: "#E5E7EB"
    dark:
      bg: "#0a0a0c"
      bgSecondary: "#1E1E1E"
      text: "lab(84.92% 0 -.0000119209)"
      textSecondary: "#9CA3AF"
      border: "#2D2D2D"

# 3. 导航
navigation:
  - name: Timeline
    path: /
    icon: lucide:git-commit
  - name: Archive
    path: /archive
    icon: lucide:database
  - name: Universe
    path: https://github.com
    external: true

# 4. 归档分类
category:
  tech:
    label: "[TECH]"
    color: "#6528F7"
    desc: "技术与编程"
  review:
    label: "[REVIEW]"
    color: "#39ff14"
    desc: "书/影/音/游"
  life:
    label: "[LIFE]"
    color: "#F90000"
    desc: "随笔与生活"

# 5. 全局播放器
bgm:
  enabled: true
  defaultPlaylist:
    - https://music.163.com/playlist?id=8882890045

# 6. 运维通知
ops:
  bark:
    enabled: true
    deviceKeyEnv: "BARK_KEY"
    iconUrl: ""

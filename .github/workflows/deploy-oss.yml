name: Deploy to Aliyun OSS

on:
  push:
    branches:
      - dev
      - master
    paths-ignore:
      - 'spec/**'
      - '**.md'
  repository_dispatch:
    types:
      - content_changed
  workflow_dispatch:
    inputs:
      blog_ref:
        description: Blog repository ref (branch/tag/sha)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-oss-${{ github.event.client_payload.event_id || github.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'dev' }}
          fetch-depth: 0 # 完整历史，确保多 commit push 时 before SHA 可达

      - name: Checkout blog repository
        uses: actions/checkout@v4
        with:
          repository: sounfury/blog
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.source_sha || github.event.client_payload.source_ref || inputs.blog_ref || 'main' }}
          path: .external/blog
          fetch-depth: 1

      - name: Sync blog content
        shell: bash
        run: |
          set -euo pipefail
          SRC_ROOT=".external/blog"
          CATEGORIES=()

          while IFS= read -r -d '' dir; do
            cat_name="$(basename "$dir")"
            # 只识别一级目录为分类，后续层级仅作为文章路径
            if find "$dir" -type f \( -iname '*.md' -o -iname '*.mdx' \) | grep -q .; then
              CATEGORIES+=("$cat_name")
            fi
          done < <(find "$SRC_ROOT" -mindepth 1 -maxdepth 1 -type d ! -name '.git' ! -name '.github' ! -name 'script' ! -name 'template' ! -name 'todo' -print0)

          if [ "${#CATEGORIES[@]}" -eq 0 ]; then
            echo "No valid single-level category directories found under ${SRC_ROOT}."
            echo "Expected layout: <CATEGORY>/<POST>.md(x)"
            echo "Directory snapshot:"
            find "${SRC_ROOT}" -maxdepth 2 -type d | sort
            exit 1
          fi

          echo "Detected categories:"
          printf '  - %s\n' "${CATEGORIES[@]}"

          mkdir -p src/content/blog
          RSYNC_ARGS=(-a --delete)
          for cat in "${CATEGORIES[@]}"; do
            RSYNC_ARGS+=("--include=${cat}/***")
          done
          RSYNC_ARGS+=("--exclude=*")
          rsync "${RSYNC_ARGS[@]}" "${SRC_ROOT}/" src/content/blog/
          echo "Synced dynamic categories to src/content/blog"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload to Aliyun OSS
        uses: fangbinwei/aliyun-oss-website-action@v1
        with:
          accessKeyId: ${{ secrets.OSS_ACCESS_KEY_ID }}
          accessKeySecret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          bucket: ${{ secrets.OSS_BUCKET }}
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          folder: dist

      - name: Install notification dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Send Bark notification (success)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          DISPATCH_SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          DISPATCH_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          DISPATCH_EVENT_ID: ${{ github.event.client_payload.event_id }}
          DISPATCH_CHANGED_FILES: ${{ toJSON(github.event.client_payload.changed_files) }}
          DISPATCH_NEWLY_PUBLISHED_FILES: ${{ toJSON(github.event.client_payload.newly_published_files) }}
        run: python3 scripts/notify.py

      - name: Send Bark notification (failure)
        if: failure()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          NOTIFY_STATUS: failure
        run: python3 scripts/notify.py

